<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeginAI Wave 1 Review</title><style>body{margin:0;background:#06090d;color:#f5f7f9;font-family:Tahoma,Arial,sans-serif}header{position:sticky;top:0;z-index:2;padding:16px 20px;background:#0a0f15eF;border-bottom:1px solid #ffffff18;backdrop-filter:blur(12px)}h1{margin:0 0 6px;font-size:20px}p{margin:0;color:#c0c8d2}.tabs{display:flex;gap:8px;margin-top:12px}.tabs a{color:#ffe2a0;text-decoration:none;border:1px solid #f6cd7655;padding:7px 12px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:20px}.card{background:#111a24;border:1px solid #ffffff18;border-radius:18px;padding:12px;box-shadow:0 12px 30px #0007}.card h2{font-size:15px;margin:0 0 10px}.card img{width:100%;height:auto;border-radius:12px;background:#030507;display:block}.desktop img{max-height:520px;object-fit:contain}.tag{font:12px monospace;color:#edb84f}.section{padding:6px 20px 0;font-size:18px}</style><header><h1>NeginAI v2 — Wave 1 Visual Review</h1><p>10 screens · mobile 390 + desktop 1440 · Build PASS · No overflow · No console errors · Axe serious/critical: 0</p><div class="tabs"><a href="#mobile">Mobile 390</a><a href="#desktop">Desktop 1440</a></div></header><h2 class="section" id="mobile">Mobile 390</h2><main class="grid" id="m"></main><h2 class="section" id="desktop">Desktop 1440</h2><main class="grid desktop" id="d"></main><script>const names=['01-auth','02-home','03-routes','04-dayroute','05-customers','06-map','07-customer360','08-visit','09-catalog','10-cart'];const label={'01-auth':'AUTH-01 Login','02-home':'PLT-01 Home','03-routes':'SEL-01 My Routes','04-dayroute':'SEL-02 Day Route','05-customers':'SEL-03 Customers','06-map':'MAP-01 Route Map','07-customer360':'CUS-01 Customer 360','08-visit':'VIS-01 Visit','09-catalog':'ORD-01 Catalog','10-cart':'ORD-04 Cart'};function fill(id,v){document.ge
