name: neginai-enterprise

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEGINAI_POSTGRES_DB:-neginai}
      POSTGRES_USER: ${NEGINAI_POSTGRES_USER:-neginai_app}
      POSTGRES_PASSWORD: ${NEGINAI_POSTGRES_PASSWORD:?set NEGINAI_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${NEGINAI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - neginai_postgres_data:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${NEGINAI_REDIS_PASSWORD:?set NEGINAI_REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${NEGINAI_REDIS_PORT:-6379}:6379"
    volumes:
      - neginai_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${NEGINAI_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${NEGINAI_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${NEGINAI_OTEL_HEALTH_PORT:-13133}:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [backend]

networks:
  backend:
    internal: true

volumes:
  neginai_postgres_data:
  neginai_redis_data:
