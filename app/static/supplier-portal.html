<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>کارتابل تأمین‌کنندگان نگین پخش</title><link rel="icon" href="/static/negin-brand-icon-192.png"><link rel="stylesheet" href="/static/supplier-portal.css?v=8"></head><body>
<div class="sp-shell"><header class="sp-top"><div class="sp-brand"><img src="/static/negin-brand-icon-192.png" alt=""><div><strong>کارتابل تأمین‌کنندگان نگین پخش</strong><small>بررسی، تأیید و هماهنگی سفارش‌ها</small></div></div><div class="sp-top-actions"><span id="supplierBadge"></span><button id="changePasswordButton" class="hidden" type="button">تغییر رمز عبور</button><button id="logoutButton" class="hidden" type="button">خروج امن</button></div></header>
<main id="loginView" class="sp-login"><section class="sp-card"><div class="sp-card-body"><h1>ورود تأمین‌کننده</h1><p>شماره موبایل ثبت‌شده به‌عنوان نام کاربری و رمز عبور خود را وارد کنید.</p><div id="loginError" class="error hidden" role="alert"></div><form id="loginForm" class="sp-form"><label class="field"><span>نام کاربری (شماره موبایل)</span><input id="username" name="username" autocomplete="username" required dir="ltr"></label><label class="field"><span>رمز عبور</span><input id="password" name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary" type="submit">ورود به کارتابل</button></form></div></section></main>
<main id="passwordView" class="sp-login hidden"><section class="sp-card"><div class="sp-card-body"><h1>تغییر رمز عبور</h1><p>در صورت تمایل یک رمز شخصی انتخاب کنید.</p><div id="passwordError" class="error hidden" role="alert"></div><form id="passwordForm" class="sp-form"><label class="field"><span>رمز فعلی</span><input id="currentPassword" type="password" autocomplete="current-password" required></label><label class="field"><span>رمز جدید (حداقل ۱۰ نویسه)</span><input id="newPassword" type="password" minlength="10" autocomplete="new-password" required></label><label class="field"><span>تکرار رمز جدید</span><input id="newPasswordAgain" type="password" minlength="10" autocomplete="new-password" required></label><button class="btn btn-primary" type="submit">ثبت رمز و ادامه</button><button id="cancelPasswordChange" class="btn btn-secondary" type="button">بازگشت به کارتابل</button></form></div></section></main>
<main id="portalView" class="sp-main hidden"><div class="sp-grid"><aside class="sp-card sp-side"><div class="sp-card-head"><div><h2>سفارش‌های من</h2><p>هر مرحله، فهرست جداگانه دارد</p></div></div><div class="sp-card-body"><nav id="orderStageNav" aria-label="مراحل سفارش‌های من"></nav><div id="orderStats" class="sp-stats hidden"></div><p id="orderSectionSummary" role="status"></p><div id="orderList" class="sp-list section-gap"></div></div></aside><section id="orderDetail" class="sp-card"><div class="sp-empty">یک سفارش را برای بررسی انتخاب کنید.</div></section></div></main></div>
<script src="/static/supplier-portal.js?v=11" defer></script></body></html>
